[workspace]
resolver = "3"
members = ["api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.lints.rust]
# This is financial software: memory safety bugs are not acceptable.
unsafe_code = "forbid"

[workspace.lints.clippy]
# Panics in a request path become outages; failures must be typed errors.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# Money code must never rely on silent numeric truncation.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
float_arithmetic = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
