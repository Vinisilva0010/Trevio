# cargo-deny policy. Run locally with `cargo deny check` (see CONTRIBUTING.md);
# CI runs the same checks.

[graph]
all-features = true

[advisories]
# Known vulnerabilities and unmaintained crates fail the build. If one must be
# ignored, add it to `ignore` with a reason and a TECH_DEBT.md item.
version = 2
ignore = []

[licenses]
version = 2
# Allow-list: anything not listed here fails. The project license itself is
# not decided yet (see docs/TECH_DEBT.md), so workspace crates are private.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io: no git dependencies, no alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
